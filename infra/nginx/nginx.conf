user  nginx;
worker_processes  auto;

# 선박 1척 + 웹앱 몇 명 규모다. 근거 없는 큰 숫자를 넣지 않는다.
events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # nginx $request_id 를 앱 로그까지 관통시킨다. 사고 한 건의 전체 경로를 재구성할 수 있다.
    # $uri 는 rewrite 이후 값이라 SPA fallback 때문에 모든 경로가 /index.html 로 뭉개진다.
    # 원본 요청줄($request)을 함께 남겨야 "어느 화면에서 이탈했나"를 알 수 있다.
    log_format json_combined escape=json
      '{"time":"$time_iso8601","rid":"$request_id","remote":"$remote_addr",'
      '"request":"$request","uri":"$uri","status":$status,'
      '"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time",'
      '"ref":"$http_referer","ua":"$http_user_agent"}';

    # ⚠ access_log 를 http 레벨에 두지 않는다.
    # 같은 레벨의 access_log 는 서로를 대체하지 않고 둘 다 기록된다.
    # http 레벨 기본 로그가 살아 있으면 마스킹한 줄 옆에 마스킹 안 된 줄이 나란히 남는다.
    # server 블록(conf.d/floaq.conf)에서만 선언한다.

    # ⚠ 에러 로그는 /dev/stderr 로 명시한다.
    # 이미지의 /var/log/nginx/*.log 는 심볼릭 링크인데, 그 디렉터리에 볼륨을 마운트하면
    # 링크가 가려져 docker logs 가 빈다. 하필 기동 실패([emerg])가 그리로 나온다.
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # ⚠ gzip 은 여기 한 곳에서만 선언한다.
    # conf.d/*.conf 에도 쓰면 [emerg] "gzip" directive is duplicate 로 기동 자체를 거부한다.
    # 80/443 이 통째로 죽는다. nginx.conf 만 단독으로 nginx -t 하면 통과해서 안 보인다.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;

    # ── kiosk CORS 허용 목록 ──
    # 선내 PC 의 kiosk 는 localhost 에서 서빙되므로 EC2 와 다른 origin 이다(계획.md §9.7).
    #
    # ⚠ $http_origin 을 그대로 되돌려주지 않는다. 그러면 임의의 사이트가
    #    사용자 브라우저로 이 API 를 읽을 수 있다. map 으로 정확히 일치하는 것만 통과시킨다.
    # ⚠ 일치하지 않으면 빈 문자열이고, nginx 는 값이 빈 add_header 를 아예 내보내지 않는다.
    #    → 허용 안 된 origin 은 헤더가 없어 브라우저가 차단한다. 이게 의도한 동작이다.
    # ⚠ localhost 와 127.0.0.1 은 서로 다른 origin 이다. 둘 다 필요하다.
    #
    # 포트 5174 는 vite dev·preview 양쪽에 strictPort 로 고정돼 있다.
    # 바꾸면 여기도 같이 바꿔야 한다.
    #
    # ⚠ **floaq.example.com 는 여기 넣지 않는다** (2026-09-18). 그 호스트는 자기 server 블록에서
    #   /api/ 를 직접 프록시해 동일 오리진이다(conf.d/kiosk.conf) — CORS 가 개입할 자리가 없다.
    #   넣으면 안 쓰는 허용 항목이 하나 남아, 나중에 "왜 여긴 되지" 를 되묻게 된다.
    map $http_origin $cors_origin {
        default                  "";
        "http://localhost:5174"  $http_origin;
        "http://127.0.0.1:5174"  $http_origin;
    }

    upstream backend {
        server app:8080;
        # nginx 가 항상 먼저 닫아야 한다. Tomcat keep-alive-timeout 은 120s.
        # 백엔드가 먼저 끊으면 nginx 가 이미 닫힌 커넥션에 요청을 실어 보내 간헐 502 가 난다.
        # 재현이 극도로 어렵다.
        keepalive          32;
        keepalive_timeout  30s;
        keepalive_requests 200;
    }

    include /etc/nginx/conf.d/*.conf;
}
