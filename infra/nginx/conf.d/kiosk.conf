# kiosk.floaq.example.com — 선내 단말 화면의 공개 시연판 (2026-09-18 분리. 전에는 floaq.example.com/kiosk/).
#
# 인증서는 floaq.example.com 와 공유한다. certbot -d 네 이름 → SAN 하나 → live/floaq.example.com/
# ⚠ 이 파일을 올리기 전에 인증서를 먼저 확장해야 한다(infra/README.md).
#   SAN 에 kiosk.floaq.example.com 가 없으면 브라우저가 이름 불일치로 막는다 —
#   nginx 는 아무 불평 없이 뜬다. 조용히 안 되는 쪽이다.
#
# ── 하위 경로에서 서브도메인으로 옮긴 이유 ──
#   base=/kiosk/ 로 빌드해야 하는 제약이 사라진다. 선내판(Pi 가 /kiosk/ 로 서빙)과
#   시연판이 같은 빌드 설정을 쓰게 된다 — 빌드가 갈리는 지점이 하나 줄었다.
#
# ⚠ 이 번들에는 VITE_KIOSK_KEY 를 넣지 않는다. 주소가 바뀌었을 뿐 **여전히 공개**다 —
#   api.md §1.1 의 "선내 한정" 전제는 그대로 깨져 있다. 없으면 조회는 되고 해역 이동만
#   거부된다. 방문자가 수집 해역을 옮겨 API 쿼터를 태우는 것도 같이 막힌다 (Jenkinsfile.deploy).

server {
    listen 80;
    listen [::]:80;
    server_name kiosk.floaq.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # $host 유지. floaq.conf 처럼 apex 로 고정하면 시연판 접속이 관제 웹으로 이탈한다
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kiosk.floaq.example.com;

    ssl_certificate     /etc/letsencrypt/live/floaq.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/floaq.example.com/privkey.pem;

    # server 레벨에서만. http 레벨과 중복 시 이중 기록 (nginx.conf 주석)
    access_log /dev/stdout json_combined buffer=64k flush=5s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 🔴 **CORS 를 쓰지 않는다.** 이 호스트가 /api/ 를 직접 프록시하므로 시연판에게는 동일 오리진이다.
    #    kiosk 번들은 `piUrl()`(packages/shared/src/origins.ts)로 **상대 경로**를 부른다 —
    #    선내에서는 Pi 가, 여기서는 이 블록이 받는다. 오리진을 박아 넣지 않는 설계가 그대로 산다.
    #    CORS 로 풀었다면 nginx.conf 의 허용 목록과 preflight 헤더 목록이 유지 지점으로 하나 더 늘었다.
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";     # upstream keepalive 를 살린다

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        # 백엔드가 CORS 헤더를 내보내게 되더라도 여기서는 필요 없다. 둘이 되면 브라우저가 막는다
        proxy_hide_header Access-Control-Allow-Origin;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # client_max_body_size 는 기본값(1m)으로 둔다.
    # 사고 산출물 tar 업로드(POST /api/pi/archives, 40m)는 Pi 가 floaq.example.com 로 낸다 —
    # 시연판 호스트로 큰 것을 올릴 일이 없다. 필요해지면 그때 올린다.

    # /ws 는 두지 않는다. kiosk 의 실시간은 Pi 의 mosquitto(9001)고 EC2 의 WebSocket 은
    # 관제 웹 몫이다. 시연판은 --mode fixture 라 브로커에 아예 붙지 않는다.

    # 해시 라우팅이라 서버가 볼 경로는 `/` 하나지만, fallback 은 남긴다 —
    # 옛 `/kiosk/...` 링크나 오타가 404 대신 화면으로 가야 한다
    location / {
        root /usr/share/nginx/kiosk;
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /assets/ {
        root /usr/share/nginx/kiosk;
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        # 캐시 헤더를 붙이는 순간 상위 보안 헤더가 끊긴다. 여기서도 다시 선언
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
