# 도메인: floaq.example.com (정식 호스트) · www.floaq.example.com (301 리다이렉트)
# 인증서는 두 이름을 모두 포함한다. 디렉터리 이름은 certbot 의 첫 -d 인자를 따른다 → live/floaq.example.com/

# ---------------------------------------------------------------- 80: ACME + HTTPS 승격
server {
    listen 80;
    listen [::]:80;
    server_name floaq.example.com www.floaq.example.com;

    # 인증서 발급·갱신 경로. HTTPS 리다이렉트보다 먼저 와야 한다.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://floaq.example.com$request_uri; }
}

# ---------------------------------------------------------------- 443 www: apex 로 정규화
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.floaq.example.com;

    ssl_certificate     /etc/letsencrypt/live/floaq.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/floaq.example.com/privkey.pem;

    return 301 https://floaq.example.com$request_uri;
}

# ---------------------------------------------------------------- 443 apex: 본체
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name floaq.example.com;

    ssl_certificate     /etc/letsencrypt/live/floaq.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/floaq.example.com/privkey.pem;

    # access_log 는 여기(server 레벨)에서만 선언한다. http 레벨과 중복되면 둘 다 기록된다.
    # buffer/flush 로 매 요청마다 디스크를 치지 않게 한다.
    access_log /dev/stdout json_combined buffer=64k flush=5s;

    # server 레벨 공통 헤더.
    # ⚠ add_header 는 하위 블록에 하나라도 있으면 상속되지 않는다.
    # 아래 location 마다 다시 선언해야 한다. 빠뜨리면 정작 HTML 문서에 CSP 가 안 붙는다.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # HSTS 는 시연·배포가 안정된 뒤에 켠다.
    # 브라우저가 값을 캐시하므로, 켠 상태에서 HTTPS 가 깨지면 되돌릴 방법이 없다.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    # 사고 산출물 tar 업로드 (POST /api/pi/archives).
    # ⚠ Spring max-request-size(34MB)보다 **크게** 둔다. nginx 가 먼저 끊으면
    #   413 MEDIA_TOO_LARGE(JSON) 대신 nginx 기본 HTML 이 가서 Pi 가 청크를 쪼갤 단서를 못 받는다.
    #   프레임 크기를 실측하면 Spring 쪽과 같이 조정한다 (api.md §4).
    client_max_body_size 40m;

    location /api/ {
        # ── preflight ──
        # OPTIONS 를 백엔드로 넘기지 않고 여기서 끊는다.
        # 넘기면 Spring 이 CORS 설정 없이 405 를 돌려주고, 브라우저는 본 요청을 아예 보내지 않는다.
        # ⚠ if 블록은 별도 설정 문맥이라 바깥 add_header 를 상속하지 않는다. 안에서 다시 선언한다.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            # kiosk 가 보내는 커스텀 헤더를 여기 전부 적는다. JWT 를 붙이면 Authorization 도 추가한다 —
            # 빠뜨리면 본 요청이 아니라 preflight 에서 막혀 원인이 안 보인다.
            # X-Floaq-Kiosk-Key: 수집 해역 이동 키 (api.md §1.1, 2026-09-15)
            add_header Access-Control-Allow-Headers "Content-Type, X-Floaq-Kiosk-Key" always;
            add_header Access-Control-Max-Age       600 always;   # Chrome 상한이 600s. 더 크게 써도 잘린다
            add_header Vary                         Origin always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";     # upstream keepalive 를 살린다

        # 이 블록에 proxy_set_header 가 있으므로 server 레벨 헤더가 상속되지 않는다. 다시 선언.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        # ⚠ CORS 헤더는 nginx 한 곳에서만 만든다.
        #    나중에 Spring 에 @CrossOrigin 이나 WebMvcConfigurer 를 넣으면 헤더가 둘이 되고,
        #    브라우저는 Access-Control-Allow-Origin 이 2개면 "허용된 origin 이 아니다" 로 막는다.
        #    두 개짜리 헤더는 개발자 도구에서도 한 줄로 합쳐 보여서 원인 찾기가 어렵다.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        # 응답이 Origin 에 따라 달라진다. 없으면 중간 캐시가 다른 origin 의 응답을 재사용한다.
        add_header Vary Origin always;

        # Access-Control-Allow-Credentials 는 넣지 않는다.
        # kiosk 는 인증이 없다(선내 전용 단말). 켜는 순간 쿠키가 실려 나가고
        # 되돌릴 때 브라우저 캐시까지 신경 써야 한다.

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_read_timeout 3600s;   # 롱커넥션 유지
        proxy_send_timeout 3600s;
    }

    # ⚠ kiosk 공개 시연판은 여기 없다. **kiosk.floaq.example.com 로 옮겼다** (2026-09-18, conf.d/kiosk.conf).
    #   /kiosk/ 는 리다이렉트도 남기지 않았다 — 아래 `location /` 의 SPA fallback 이
    #   받아서 관제 웹 index.html 을 내려준다. 옛 링크는 관제 웹 화면으로 간다.
    #   (되살리려면 `location = /kiosk { return 301 https://kiosk.floaq.example.com/; }` 한 줄이면 된다)

    # apps/web 빌드 산출물.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        # 캐시 헤더를 붙이는 순간 상위 보안 헤더가 끊긴다. 여기서도 다시 선언.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
