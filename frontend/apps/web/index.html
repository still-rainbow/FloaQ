<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloaQ 관제</title>
    <!-- 선내 단말과 같은 탭 아이콘(부표). 파일 없이 SVG 를 그대로 싣는다 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2c14e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23123243'/%3E%3C/svg%3E" />
    <!--
      서체는 Google Fonts CDN. 웹(육상 관제)은 인터넷 전제라 허용된다.
      ⚠ kiosk 로 옮길 때는 self-host 로 바꾼다 — 선내 단말은 인터넷 없이 동작해야 한다(계획.md §9.13).
         폰트가 없으면 fallback 으로 뜨긴 하지만 수치 정렬(tabular-nums)이 깨진다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
