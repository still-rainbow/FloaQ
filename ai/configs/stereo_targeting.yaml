cameras:
  left_index: 0
  right_index: 1

# Generated on the final, rigidly mounted camera pair. Do not reuse another
# pair's calibration or change resolution/focus after calibration.
calibration_file: configs/stereo_calibration.npz

detection:
  confidence: 0.45
  iou: 0.70
  device: 0

stereo:
  min_disparity: 0
  num_disparities: 128
  block_size: 5
  disp12_max_diff: 1
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  minimum_valid_disparity: 1.0
  minimum_valid_pixels: 80

launcher:
  # Prototype measurement, 2026-09-21. Hull coordinates use x right, y down,
  # z forward. The physical left lens is at (-0.170, -0.015, +0.090) m and
  # the launcher origin is at (0.000, -0.162, +0.270) m. The left camera is
  # yawed 8.5 degrees inward (right), with no pitch or roll. This origin is
  # expressed in the physical left-camera frame, not the rectified frame.
  origin_in_left_camera_m: [0.141527, -0.147000, 0.203150]
  # Rotate physical left-camera vectors into the level launcher/hull frame.
  # stereo_targeting.py first removes the calibration's left rectification.
  rotation_launcher_from_left_camera:
    - [0.989015863, 0.0, 0.147809411]
    - [0.0, 1.0, 0.0]
    - [-0.147809411, 0.0, 0.989015863]
  # Two provisional measurements. Interpolate only within 2.5-25 degrees;
  # never extrapolate beyond the measured range.
  pitch_servo_calibration:
    - {command: 110.0, angle_deg: 2.5}
    - {command: 90.0, angle_deg: 25.0}
  min_pitch_deg: -45.0
  max_pitch_deg: 45.0
  gravity_mps2: 9.80665
  # Launch power was reduced after the 2026-09-18 test. Keep this unset until
  # repeated range measurements produce a new mean and deviation.
  launch_speed_mps: null

stability:
  sample_count: 8
  max_yaw_std_deg: 1.5
  max_pitch_std_deg: 1.5
  max_range_std_m: 0.25

aim_only:
  minimum_confidence: 0.45
  publish_interval_s: 0.20
  yaw_deadband_deg: 0.5
  pitch_deadband_deg: 0.5
