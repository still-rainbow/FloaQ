# Fast demo targeting: raw detections plus measured camera geometry.
cameras:
  horizontal_fov_deg: 52.0
  # 🔴 z(앞뒤)는 수기값(0.090 / 0.105)에서 14.5cm 뒤로 옮겼다. 2026-09-23 실측 —
  #    배 중심에서 0.60m·0.45m 목표가 0.47m·0.33m(발사관 기준)로 읽혔다. 발사관 기준
  #    정답은 0.33m·0.18m(= 중심 거리 - 0.27m)다. 카메라가 14.5cm 뒤에 있다고 보면 두 점이
  #    0.5cm 안으로 맞는다(각도·화각으로는 안 맞았다). 배 중심 = 원점이다.
  left_position_m: [-0.170, -0.015, -0.055]
  right_position_m: [0.185, -0.015, -0.040]
  # 수기 측정(09-21) 그대로다.
  # ⚠ 09-23 에 8.94 / -5.94 로 바꿨다가 되돌렸다. 거리를 **배 선미**에서 잰 값과
  #   비교해서 생긴 오해였다 — Jetson 거리는 **발사관 회전축**(아래 launcher.position_m)
  #   에서 잰다. 거리를 확인할 때는 발사관 회전축 바로 아래 바닥부터 잰다.
  left_yaw_deg: 8.5
  right_yaw_deg: -5.5

stereo:
  max_pair_skew_ms: 1000
  max_range_m: 3.0

launcher:
  position_m: [0.0, -0.162, 0.270]
  # 위아래는 계산한 시선각을 이 범위에 붙여서 보낸다 (밖이면 끝값).
  # 🔴 Pi `floaq/config.py` 와 같아야 한다 — `PITCH_CAL`(-10:148.9 / 0:140 / 25:117.8)
  #    의 양 끝, `PITCH_MIN_DEG`/`PITCH_MAX_DEG`. 그 밖의 값이 Pi 에 가면 조준이
  #    통째로 버려지거나 서보가 얼어붙는다(좌우까지).
  # 0 = CH1 140 = 수평 (2026-09-23 실측). 아래 포물선으로 푼 각도를 이 범위에
  # 붙인다. Pi 의 PITCH_MIN_DEG(-10) 보다 아래로는 내리지 않는다.
  min_pitch_deg: -10.0
  max_pitch_deg: 25.0
  # 🔴 발사각은 포물선으로 푼다 (`_stereo_aiming.ballistic_pitch`). 부표는 고정
  #    스프링이라 떨어지는 거리를 발사각이 정한다. 목표 거리(스테레오)에 떨어지는
  #    각도를 곡선 그대로 구한다 — 직선 근사가 없다. 가까우면 숙이고 멀면 든다.
  #    닿지 않는 거리면 가장 멀리 가는 각도로 쏜다. 이 절을 지우면 시선각으로 돌아간다.
  #    각도가 클수록 입구가 위를 본다. 0 = 수평.
  #    두 거리만 적는다 — 기동 때 둘로 속도·높이를 풀어 그 사이를 곡선으로 잇는다.
  #    거리는 Jetson `range=` 와 같은 **발사관 기준**이다.
  ballistics:
    # 아래 끝(min_pitch_deg)으로 쐈을 때 떨어지는 거리. 이보다 가까우면 아래 끝.
    # 실측 20cm (2026-09-23).
    near_m: 0.20
    # 위 끝(max_pitch_deg)으로 쐈을 때 떨어지는 거리. 이보다 멀면 위 끝.
    # ⚠ **임시값**이다. 위 끝으로 한 번 쏴서 떨어진 거리로 바꾼다.
    #   작을수록 같은 거리에서 더 든다. 0.60 에서 너무 안 나가 0.45 로 줄였다 (09-23).
    far_m: 0.32

stability:
  sample_count: 2
  max_yaw_std_deg: 5.0
  max_pitch_std_deg: 2.0
  max_range_std_m: 0.50
  publish_interval_s: 0.20
  deadband_deg: 0.5
