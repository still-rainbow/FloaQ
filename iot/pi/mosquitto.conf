# Pi 로컬 브로커. 선박 내부 3자(Pi · Jetson · 키오스크) 전용.
#
# ⚠ EC2 의 mosquitto 와 다른 물건이다. Pi ↔ EC2 는 MQTT 를 쓰지 않는다 (HTTPS REST).
#   EC2 쪽 mosquitto 서비스는 삭제 대상이다.

# ── 리스너 2개 ───────────────────────────────────────────────────────
# ⚠ listener 를 하나라도 명시하면 기본 리스너가 꺼진다. 1883 도 반드시 적는다.
listener 1883
protocol mqtt
# Jetson, orchestrator

listener 9001
protocol websockets
# 키오스크. **브라우저는 raw TCP 소켓을 못 연다** — MQTT over WebSocket 이어야 한다.
#
# ⚠ mosquitto 빌드에 websockets 가 없으면 로그에 아래가 찍히고 리스너가 안 열린다:
#     Websockets support not available.
#   확인:  ldd $(which mosquitto) | grep -i websockets
#   없으면 eclipse-mosquitto:2 도커 이미지를 쓴다.

# ── 크기 상한 ────────────────────────────────────────────────────────
# ⚠ 기본값은 0 = 무제한이다. 걸려서 끊기는 게 아니라 폭주를 막을 게 없는 쪽이 위험하다.
#   jetson/snapshot 이 base64 로 약 267KB 라 512KB 로 잡는다.
#
# ⚠ mosquitto 2.1 에서 message_size_limit -> max_packet_size 로 이름이 바뀌었다.
#   구 이름도 아직 동작하지만 기동 때 경고가 뜬다. 2.0 브로커를 쓸 일이 있으면 되돌린다.
max_packet_size 524288

# ── 인증 ─────────────────────────────────────────────────────────────
# `미정`⚠ TODO(IoT) — mqtt.md §7 #6
#
# ⚠ 키오스크가 브라우저라 자격증명이 JS 번들에 그대로 노출된다. 숨길 곳이 없다.
#   익명 / 전용계정+ACL / 클라이언트 인증서 중에 골라야 한다.
#   지금은 개발 편의로 익명이다. **시연 전 반드시 닫는다.**
allow_anonymous true

# 전용계정 + ACL 로 갈 때 쓸 설정 (§1.2):
#   password_file /etc/mosquitto/passwd
#   acl_file      /etc/mosquitto/acl
#
# acl 내용:
#   user kiosk-{ship_id}
#   topic write ship/{ship_id}/kiosk/#
#   topic read  ship/{ship_id}/pi/#
#   topic read  ship/{ship_id}/jetson/#
#
# 이 ACL 이 "발행자 세그먼트" 규약을 브로커 레벨에서 강제한다.
# 키오스크 코드 버그가 Pi 인 척 상태를 발행하는 사고가 원천 차단된다.

# ── 영속성 ───────────────────────────────────────────────────────────
# **끈다.** Pi 의 상태 원본은 브로커가 아니라 SQLite 다 (mqtt.md §2.4).
# 켜두면 재부팅 후 낡은 retained 가 되살아나서 지울 대상만 늘고, microSD 쓰기도 는다.
# 재부팅하면 orchestrator.boot() 가 DB 에서 복구해 retained 를 다시 발행한다.
persistence false

log_dest stdout
log_type warning
log_type error
log_type notice
